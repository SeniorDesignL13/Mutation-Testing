[project]
name = "mtlj"
version = "0.1.0"
description = "Mutation testing for LLM-as-judge evaluators."
readme = "README.md"
authors = [
    { name = "Benjamin Duffaut", email = "ben.duffaut@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
mtlj = "mtlj.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.8",
]
operators = [
    "en-core-web-sm",
    "nltk>=3.10.3",
    "spacy>=3.8.16,<3.9",
]
service = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.34.0",
]
stats = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]
judges = [
    "deepeval>=2.0.0",
    "ragas>=0.2.0",
]

[tool.uv]
# Every group is installed by default so local, Docker, and CI envs are identical.
default-groups = "all"

[tool.uv.sources]
# spaCy models aren't on PyPI; pin the wheel so it's captured in uv.lock.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# importlib mode lets test folders mirror src/ without __init__.py files.
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not integration"]
markers = ["integration: needs a real LLM or network; opt in with `-m integration`"]
