# The operator battery used for the study. It matches default_battery() in
# src/mtlj/engine/generator.py; load it with mtlj.engine.battery_config.load_battery().
#
# Each [[operators]] table names a registered operator and the intensities to run it at,
# each in [0, 1] and listed from low to high (the loader checks). When two intensities
# reach the same dose, the lower one is kept.

# 50 / 100 / 200 / 400 filler words.
[[operators]]
name = "verbosity_padding"
intensities = [0.125, 0.25, 0.5, 1.0]

# 1 / 3 / 5 claims changed.
[[operators]]
name = "entity_swap"
intensities = [0.2, 0.6, 1.0]
