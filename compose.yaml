# Local development stack. From the repo root:
#
#   docker compose up --build
#
#   http://localhost:3000   frontend (Nuxt)
#   http://localhost:8000   API (FastAPI), docs at /docs
#   localhost:5432          Postgres (user/password/db: mtlj)
#
# Code is mounted into the containers, so edits reload automatically.
# Optional local LLMs: docker compose --profile models up --build

name: mtlj

x-env-file: &env-file
  # .env is optional; everything below has a working default.
  - path: .env
    required: false

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtlj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtlj}
      POSTGRES_DB: ${POSTGRES_DB:-mtlj}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    env_file: *env-file
    environment:
      # Inside Docker, Postgres is reachable as "db", not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mtlj}:${POSTGRES_PASSWORD:-mtlj}@db:5432/${POSTGRES_DB:-mtlj}
      # File-change events don't cross Windows/macOS mounts; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      # Dependencies live in /opt/venv, so mounting the repo never hides them.
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fe:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    env_file: *env-file
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000}
      DEV_POLLING: "true"
    volumes:
      - ./fe:/app
      # Linux node_modules and Nuxt build files stay inside Docker.
      - fe_node_modules:/app/node_modules
      - /app/.nuxt
    ports:
      - "${FE_PORT:-3000}:3000"
    depends_on:
      - api

  # Only started with `--profile models`. Pull a model once with:
  #   docker compose exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:0.35.0
    profiles: ["models"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  fe_node_modules:
  ollama_data:
