# The whole app, for development. From the repo root run:
#
#   docker compose up
#
#   http://localhost:3000   frontend (the website, Nuxt)
#   http://localhost:8000   API (FastAPI); try it at /docs
#   localhost:5432          database (Postgres; user, password and db are all "mtlj")
#
# Your code is shared with the containers, so saving a file reloads the app.
# Optional local LLMs: docker compose --profile models up

name: mtlj

x-env-file: &env-file
  # .env is optional; everything below has a working default.
  - path: .env
    required: false

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtlj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtlj}
      POSTGRES_DB: ${POSTGRES_DB:-mtlj}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # Rebuild on every `up`, so nobody has to remember `--build`. The image
    # holds only dependencies, so this is instant unless uv.lock changed.
    pull_policy: build
    env_file: *env-file
    environment:
      # Inside Docker, Postgres is reachable as "db", not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mtlj}:${POSTGRES_PASSWORD:-mtlj}@db:5432/${POSTGRES_DB:-mtlj}
      # Let the frontend call the API, whatever port it's on.
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
      # File-change events don't cross Windows/macOS mounts; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
      # Keep Python's cache files inside the container, not in your repo folder.
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      # Dependencies live in /opt/venv, so mounting the repo never hides them.
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    pull_policy: build
    env_file: *env-file
    environment:
      # The browser calls the API at its port on your machine.
      NUXT_PUBLIC_API_BASE: http://localhost:${API_PORT:-8000}
      DEV_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Linux node_modules and Nuxt build files stay inside Docker.
      - frontend_node_modules:/app/node_modules
      - /app/.nuxt
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api

  # Only started with `--profile models`. Download a model once with:
  #   docker compose exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:0.35.0
    profiles: ["models"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  frontend_node_modules:
  ollama_data:
