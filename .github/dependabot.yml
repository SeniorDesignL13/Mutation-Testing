# Weekly, grouped dependency update PRs. CI validates each one, so upgrades
# land in small reviewed steps instead of one painful catch-up.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /fe
    schedule: { interval: weekly }
    ignore:
      # Later majors switched from MIT to a paid license; see docs/DEVELOPER.md.
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primevue/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primeuix/themes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeicons"
        update-types: ["version-update:semver-major"]
    groups:
      frontend: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: monthly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
