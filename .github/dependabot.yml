# Dependabot opens PRs that update dependencies. CI tests each one; if it's
# green, merge it.
#
# - Small (minor/patch) updates come as one grouped PR per ecosystem.
#   Big (major) updates get their own PR.
# - New releases wait 7 days first (cooldown), so broken or malicious
#   releases are usually caught before they reach us.
# - Some upgrades are never proposed, because we do them on purpose:
#   Python / Node / Postgres versions (set in several places at once),
#   uv (pinned in the Dockerfile and CI), and PrimeVue majors (paid license).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primevue/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primeuix/themes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeicons"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ghcr.io/astral-sh/uv"

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci }
    groups:
      actions:
        patterns: ["*"]
