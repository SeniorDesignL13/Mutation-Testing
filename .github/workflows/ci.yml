name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: CI only reads the code. Jobs ask for more if they ever need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR cancels the old run. Runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (lint, format, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtlj
          POSTGRES_PASSWORD: mtlj
          POSTGRES_DB: mtlj
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mtlj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mtlj:mtlj@localhost:5432/mtlj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Check uv.lock is up to date
        run: |
          uv lock --check || {
            echo "::error::uv.lock doesn't match pyproject.toml. Run 'uv lock' and commit uv.lock."
            exit 1
          }

      - name: Install Python and dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: |
          uv run ruff format --check --diff . || {
            echo "::error::Some files aren't formatted. Run 'uv run python scripts/check.py' and commit the result."
            exit 1
          }

      # Includes the database tests and the models-vs-migrations check.
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies (fails if package-lock.json is stale)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: docker compose up works
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack
        run: docker compose up --detach --wait

      - name: API and database respond
        run: curl --fail --silent --show-error http://localhost:8000/testing/database

      - name: Website responds
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://localhost:3000 && exit 0
            sleep 3
          done
          echo "::error::The website didn't respond on http://localhost:3000"
          exit 1

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # The one CI check that branch protection requires before merging into main.
  ci-passed:
    name: CI passed
    if: always()
    needs: [python, frontend, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs succeeded
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A CI job above failed. Open it to see why."
            exit 1
          fi
