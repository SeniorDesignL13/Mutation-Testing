name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtlj
          POSTGRES_PASSWORD: mtlj
          POSTGRES_DB: mtlj
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mtlj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mtlj:mtlj@localhost:5432/mtlj
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Check uv.lock is up to date
        run: |
          uv lock --check || {
            echo "::error::uv.lock is out of date with pyproject.toml. Run 'docker compose exec api uv lock' and commit uv.lock."
            exit 1
          }

      - name: Install Python and dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies (fails if package-lock.json is stale)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker stack boots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build and start
        run: docker compose up --build --detach --wait

      - name: API responds
        run: curl --fail --silent --show-error http://localhost:8000/testing/database

      - name: Frontend responds
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://localhost:3000 && exit 0
            sleep 3
          done
          exit 1

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # The single required status check for merging into main.
  ci-passed:
    name: CI passed
    if: always()
    needs: [python, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
