name: PR title

# PRs are squash-merged, so the PR title becomes the commit message on main.
# It must look like "type: summary", e.g. "feat: add entity swap operator".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'Start the summary with a lowercase letter, e.g. "feat: add entity swap operator".'
